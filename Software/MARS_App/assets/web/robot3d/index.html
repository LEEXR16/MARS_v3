  #status { left: 10px; bottom: 8px; color: #6e5a45; }
  #state { font-weight: 700; letter-spacing: 1px; }
</style>
</head>
<body>
  <div id="viewport"></div>
  <div class="hud" id="hud"><span id="cuff"></span>
<span id="state"></span></div>

  <script type="importmap">
